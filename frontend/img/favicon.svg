<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .light-icon { display: inline; }
    .dark-icon  { display: none; }
    @media (prefers-color-scheme: dark) {
      .light-icon { display: none; }
      .dark-icon  { display: inline; }
    }
  </style>
  <!-- Amber: para temas claros del browser -->
  <image class="light-icon" href="data:image/png;base64," width="64" height="64"/>
  <!-- Blanco: para temas oscuros del browser -->
  <image class="dark-icon" href="data:image/png;base64," width="64" height="64"/>
</svg>