<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/pages/login.css">
    <title>Crear cuenta | CodeFlex</title>
</head>
<body class="light">
    <main class="pageContent authPageWrap">
        <div class="auth-card">
            <h1>Crear cuenta</h1>
            <p class="subtext">Registrate para gestionar tus torneos.</p>
            <form id="registerForm" novalidate>
                <label for="name">Nombre completo</label>
                <input id="name" name="nombre" type="text" autocomplete="name" required minlength="2">
                <small class="fieldError" id="nameError" aria-live="polite"></small>
                <label for="email">Correo</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <small class="fieldError" id="emailError" aria-live="polite"></small>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" required>
                <small class="fieldError" id="passwordError" aria-live="polite">Mínimo 8 caracteres, mayúscula, minúscula, número y símbolo.</small>
                <label for="confirmPassword">Confirmar contraseña</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                <small class="fieldError" id="confirmPasswordError" aria-live="polite"></small>
                <fieldset class="authFieldset">
                    <legend>Tipo de cuenta</legend>
                    <label><input type="radio" name="rol" value="participante" checked> Participante</label>
                    <label><input type="radio" name="rol" value="organizador"> Organizador</label>
                    <label><input type="radio" name="rol" value="administrador"> Administrador</label>
                    <small>Temporal: el rol se guarda en localStorage mientras no exista una tabla de roles.</small>
                </fieldset>
                <button type="submit">Crear cuenta</button>
                <p class="message" id="message" role="alert"></p>
            </form>
            <p><a href="login.html">Ya tengo una cuenta</a></p>
        </div>
    </main>
    <script src="../../js/auth.js"></script>
    <script src="../../js/pages/login.js"></script>
</body>
</html>
