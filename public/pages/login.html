<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
    <header class="topbar">
        <img id="logo" src="../img/cup.png" alt="Logo">
        <button class="menuIcon" type="button" aria-label="Abrir menú">
            <img src="../img/MH.png" alt="">
        </button>
    </header>

    <div class="menuOverlay" data-menu-close hidden></div>

    <aside class="sideMenu">
        <div class="menuHeader">
            <h2>Menú</h2>
        </div>
        <nav class="menuNav" aria-label="Menú">
            <a href="../index.html">Inicio</a>
            <a href="torneos.html">Torneos</a>
            <a href="crearTorneo.html">Crear torneo</a>
            <a href="nosotros.html">Nosotros</a>
        </nav>
        <a class="menuReg" href="login.html">Registrarse</a>
    </aside>

    <main>
        <div class="auth-card">
            <h1>Iniciar sesión / Registrarse</h1>
            <p class="subtext">Ingresa tu correo y contraseña para continuar.</p>
            <form id="authForm">
                <label for="email">Correo</label>
                <input id="email" name="email" type="email" placeholder="ejemplo@correo.com" required>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="********" required>
                <button type="submit">Continuar</button>
                <p class="message" id="message"></p>
            </form>
        </div>
    </main>

    <script src="../js/pages/login.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
