<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Equipo CodeFlex">
    <meta name="description" content="CodeFlex - Sistema de Gestión Deportiva Modular. Torneos multideporte simples, rápidos y compartibles.">

    <link rel="icon" href="../img/favicon-amber.png" type="image/png">

    <link rel="stylesheet" href="../css/pages/perfil.css">
    <title>CodeFlex — Sistema de Gestión Deportiva Modular</title>
</head>

<body class="light"> 

    <!-- Modo oscuro o modo claro -->

    <script> 
        (function() {
            const savedTheme = localStorage.getItem('siteTheme');
            if (savedTheme === 'dark') {
                document.body.classList.remove('light');
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
                document.body.classList.add('light');
            }
        })();
    </script>



    <!-- Barra superior de navegación -->

    <header class="topbar"> <!-- Cambiar nombre de la clase -->
        <div class="topbarBrand">
            <img id="logo" src="../img/cup.png" alt="Logotipo de SportAlways">
            <span class="brandName">SportAlways</span>
        </div>

        <nav class="headerNav" aria-label="Menú principal">
            <a href="../index.html">Inicio</a>
            <a href="../pages/torneos.html">Torneos</a>
            <a href="../pages/crearTorneo.html">Crear Torneo</a>
            <a href="../pages/nosotros.html">Nosotros</a>
            <a href="../pages/misTorneos.html">Mis torneos</a>
            <a href="../pages/información.html">Información</a>
        </nav>

        <div class="headerActions">
            <button class="themeToggle" type="button" aria-label="Activar modo oscuro" data-theme-toggle>
                <img class="iconSun" src="../img/iconSun.png" alt="" aria-hidden="true">
                <img class="iconMoon" src="../img/iconMoon.png" alt="" aria-hidden="true">
            </button>
            <button class="btn btnPrimary headerCta" id="openLoginBtn" type="button">Iniciar sesión</button>
            <button class="menuIcon" type="button" aria-label="Abrir menú de navegación" aria-expanded="false">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>


    <!-- Contenido principal de la página en modo celular -->

    <div class="menuOverlay" hidden data-menu-close></div>
    <div class="sideMenu" aria-hidden="true">
        <div class="sideMenuHeader">
            <span class="brandName">CodeFlex</span>
            <button class="btnClose" type="button" aria-label="Cerrar menú" data-menu-close>✕</button>
        </div>

        <nav class="sideMenuNav" aria-label="Menú móvil">
            <a href="../index.html">Inicio</a>
            <a href="../pages/torneos.html">Torneos</a>
            <a href="../pages/crearTorneo.html">Crear Torneo</a>
            <a href="../pages/nosotros.html">Nosotros</a>
            <a href="../pages/misTorneos.html">Mis torneos</a>
            <a href="../pages/información.html">Información</a>

            <hr class="menuDivider">
            <a href="pages/login.html" class="menuReg">Registrarse</a>
        </nav>
    </div>

    <main>
         <!-- Sección para autenticación de usuarios -->

        <div class="authOverlay" id="authOverlay" hidden>
            <div class="authModal" role="dialog" aria-modal="true" aria-label="Autenticación">
                <button class="authClose" id="authClose" type="button" aria-label="Cerrar">✕</button>

                <!-- Panel login -->

                <div class="authPanel" id="panelLogin">
                    <div class="authHeader">
                        <img src="img/cup.png" alt="" class="authLogo">
                        <h2>Iniciar sesión</h2>
                        <p class="authSub">Bienvenido de vuelta a CodeFlex</p>
                    </div>
                    <div class="authField">
                        <label for="loginEmail">Correo electrónico</label>
                        <input type="email" id="loginEmail" placeholder="tu@email.com" autocomplete="email">
                    </div>
                    <div class="authField">
                        <label for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <button class="btn btnPrimary authSubmit" type="button">Ingresar</button>
                    <p class="authSwitch">¿No tenés cuenta? <button type="button" class="authLink" id="toRegister">Registrarse</button></p>
                </div>

                <!-- Panel registro -->

                <div class="authPanel authPanelHidden" id="panelRegister">
                    <div class="authHeader">
                        <img src="img/cup.png" alt="" class="authLogo">
                        <h2>Crear cuenta</h2>
                        <p class="authSub">Sumate a CodeFlex gratis</p>
                    </div>
                    <div class="authField">
                        <label for="regName">Nombre completo</label>
                        <input type="text" id="regName" placeholder="Tu nombre" autocomplete="name">
                    </div>
                    <div class="authField">
                        <label for="regEmail">Correo electrónico</label>
                        <input type="email" id="regEmail" placeholder="tu@email.com" autocomplete="email">
                    </div>
                    <div class="authField">
                        <label for="regPassword">Contraseña</label>
                        <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password">
                    </div>
                    <div class="authField">
                        <label for="regConfirm">Confirmar contraseña</label>
                        <input type="password" id="regConfirm" placeholder="••••••••" autocomplete="new-password">
                    </div>
                    <button class="btn btnPrimary authSubmit" type="button">Crear cuenta</button>
                    <p class="authSwitch">¿Ya tenés cuenta? <button type="button" class="authLink" id="toLogin">Iniciar sesión</button></p>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/pages/perfil.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
